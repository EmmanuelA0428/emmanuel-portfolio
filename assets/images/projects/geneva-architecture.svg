<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Geneva air quality platform architecture</title>
  <desc id="archDesc">Data flow from sensors through API and BigQuery to dashboard; scheduling via Cloud Scheduler and Pub/Sub.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1e3a5f"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #1e3a5f; stroke-width: 1.2; }
    .label { font: 600 11px system-ui, sans-serif; fill: #1a2332; }
    .sub { font: 10px system-ui, sans-serif; fill: #4a5568; }
    .flow { stroke: #1e3a5f; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    .control { stroke: #2c5282; stroke-width: 1; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow); }
  </style>
  <rect class="box" x="8" y="72" width="88" height="76" rx="2"/>
  <text class="label" x="52" y="102" text-anchor="middle">RAMP</text>
  <text class="sub" x="52" y="118" text-anchor="middle">sensors</text>
  <line class="flow" x1="96" y1="110" x2="128" y2="110"/>
  <rect class="box" x="128" y="72" width="88" height="76" rx="2"/>
  <text class="label" x="172" y="102" text-anchor="middle">Sensit</text>
  <text class="sub" x="172" y="118" text-anchor="middle">Connect API</text>
  <line class="flow" x1="216" y1="110" x2="248" y2="110"/>
  <rect class="box" x="248" y="58" width="104" height="104" rx="2"/>
  <text class="label" x="300" y="98" text-anchor="middle">Cloud</text>
  <text class="sub" x="300" y="114" text-anchor="middle">Function</text>
  <text class="sub" x="300" y="128" text-anchor="middle">ingest + QA</text>
  <line class="flow" x1="352" y1="110" x2="384" y2="110"/>
  <rect class="box" x="384" y="72" width="88" height="76" rx="2"/>
  <text class="label" x="428" y="102" text-anchor="middle">BigQuery</text>
  <text class="sub" x="428" y="118" text-anchor="middle">storage</text>
  <line class="flow" x1="472" y1="110" x2="504" y2="110"/>
  <rect class="box" x="504" y="58" width="104" height="104" rx="2"/>
  <text class="label" x="556" y="98" text-anchor="middle">Analytics</text>
  <text class="sub" x="556" y="114" text-anchor="middle">AQI, agg.</text>
  <line class="flow" x1="608" y1="110" x2="640" y2="110"/>
  <rect class="box" x="640" y="72" width="72" height="76" rx="2"/>
  <text class="label" x="676" y="102" text-anchor="middle">Shiny</text>
  <text class="sub" x="676" y="118" text-anchor="middle">Cloud Run</text>
  <rect class="box" x="248" y="178" width="88" height="32" rx="2"/>
  <text class="sub" x="292" y="198" text-anchor="middle">Scheduler</text>
  <line class="control" x1="292" y1="178" x2="292" y2="162"/>
  <rect class="box" x="352" y="178" width="72" height="32" rx="2"/>
  <text class="sub" x="388" y="198" text-anchor="middle">Pub/Sub</text>
  <line class="control" x1="292" y1="194" x2="352" y2="194"/>
  <line class="control" x1="388" y1="178" x2="388" y2="162"/>
  <line class="control" x1="388" y1="162" x2="300" y2="162"/>
</svg>